# =============================================================================
# Dataset config for the improvement experiments (project-local).
# The original repo config (code/FCN/config/dataset_config.yaml) is untouched.
# =============================================================================
# Field definitions are IDENTICAL to the author's Criteo_x4_001 entry:
#   13 I-columns (convert_to_bucket -> categorical) + 26 C-columns (categorical),
#   label=Label, min_categr_count=10.
# Only paths/format differ:
#   1) dataset_id is Criteo_x4_10_h5 (the directory name the author actually used;
#      the "10" is min_categr_count=10). Upstream only ships Criteo_x4_001 (csv),
#      while the author's log shows data_format=h5 and dataset_id=Criteo_x4_10_h5,
#      i.e. he had an uncommitted config.
#   2) data_format is h5 and the paths point at this project's h5 files.
#
# Vocab cross-check baseline (from FCNv2_Criteo.log "Feature specs"), used by
# tools/check_vocab_consistency.py. If the local h5 disagrees, the data pipeline
# is on a different footing than the paper and must be investigated first:
#   C1 1446 / C3 157339 / C4 117822 / C7 11882 / C12 156656 / C16 148913
#   C21 154564 / C24 53031 / C26 40955 ; I1 44 / I5 220 / I13 72 (full table in
#   the improvement plan document under docs/ appendix A)
#
# ASCII-only on purpose: fuxictr 2.0.1 load_config() opens yaml without an
# explicit encoding, so non-ASCII bytes break loading on GBK / LANG=C locales.
# =============================================================================

Criteo_x4_10_h5:
    data_format: h5
    data_root: './data/'
    feature_cols:
    -   active: true
        dtype: float
        fill_na: 0
        na_value: 0
        name: [I1, I2, I3, I4, I5, I6, I7, I8, I9, I10, I11, I12, I13]
        preprocess: convert_to_bucket
        type: categorical
    -   active: true
        dtype: str
        fill_na: ''
        na_value: ''
        name: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14, C15, C16,
            C17, C18, C19, C20, C21, C22, C23, C24, C25, C26]
        type: categorical
    label_col: {dtype: float, name: Label}
    min_categr_count: 10
    train_data: './data/Criteo_x4_10_h5/train.h5'
    valid_data: './data/Criteo_x4_10_h5/valid.h5'
    test_data: './data/Criteo_x4_10_h5/test.h5'
