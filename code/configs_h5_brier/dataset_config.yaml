# 复现用 h5 数据集定义
# 说明：data_root 用相对路径（相对仓库根目录运行），提交版便于他人复现。
#       实际实验时使用绝对路径 /public/home/.../fcn_cy/data/，除此之外与提交版完全一致。
ipinyou_x1_h5:
    data_format: h5
    data_root: ./data/
    train_data: ./data/ipinyou_x1_h5/train.h5
    valid_data: ./data/ipinyou_x1_h5/valid.h5
    test_data: ./data/ipinyou_x1_h5/test.h5
    min_categr_count: 2

kkbox_x1_h5:
    data_format: h5
    data_root: ./data/
    train_data: ./data/kkbox_x1_h5/train.h5
    valid_data: ./data/kkbox_x1_h5/valid.h5
    test_data: ./data/kkbox_x1_h5/test.h5
    min_categr_count: 10
