Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    save_best_only: True
    eval_steps: null
    debug_mode: False
    shuffle: True
    pickle_feature_encoder: True

ipinyou_fcnv1_div:
    model: FCNv1Div
    div_lambda: 0.05
    dataset_id: ipinyou_x1_h5
    loss: binary_crossentropy
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.e-3
    embedding_regularizer: 1.0e-3
    net_regularizer: 0
    batch_size: 4096
    embedding_dim: 16
    exp_num_layers: 4
    lin_num_layers: 3
    net_dropout: 0.2
    batch_norm: True
    layer_norm: False
    num_heads: 2
    epochs: 100
    seed: 2024
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'

